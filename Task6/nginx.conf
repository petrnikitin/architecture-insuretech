http {
    # Зона для хранения состояния rate limiting
    # limit_req_zone: определяет ключ ($binary_remote_addr = IP клиента) и лимит (10r/m = 10 requests per minute)
    # zone=partner_limit:10m - имя зоны и размер памяти (10 МБ хватит на ~160k IP адресов)
    limit_req_zone $binary_remote_addr zone=partner_limit:10m rate=10r/m;

    # Настройка upstream для балансировки нагрузки
    upstream backend_servers {
        server backend1.example.com;
        server backend2.example.com;
        server backend3.example.com;
    }

    server {
        listen 80;

        location / {
            # Применение rate limiting
            # zone=partner_limit - использовать зону с настройками лимита
            # burst=0 - не разрешать burst (всплески запросов), строгий лимит
            # nodelay - немедленно отклонять запросы при превышении лимита
            limit_req zone=partner_limit burst=0 nodelay;

            # Код ответа при превышении лимита (по умолчанию 503, меняем на 429)
            limit_req_status 429;

            # Проксирование запроса на backend серверы
            proxy_pass http://backend_servers;
        }

    }
}
